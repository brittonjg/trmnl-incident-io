---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{\"incidents\":[{\"id\":\"01HZXYZ123ABC\",\"name\":\"Database performance degradation\",\"reference\":\"INC-123\",\"summary\":\"Queries taking 5x longer than normal on production DB\",\"created_at\":\"2025-10-31T14:30:00Z\",\"updated_at\":\"2025-10-31T15:45:00Z\",\"incident_status\":{\"category\":\"live\",\"name\":\"Investigating\"},\"severity\":{\"name\":\"P1\",\"rank\":1},\"incident_role_assignments\":[{\"role\":{\"name\":\"Incident Lead\"},\"assignee\":{\"name\":\"Sarah Chen\"}}],\"incident_type\":{\"name\":\"Service Degradation\"},\"custom_field_entries\":[{\"custom_field\":{\"name\":\"Affected teams\"},\"values\":[{\"value_catalog_entry\":{\"name\":\"Platform\"}},{\"value_catalog_entry\":{\"name\":\"Core\"}}]}]},{\"id\":\"01HZXYZ124DEF\",\"name\":\"API rate limiting errors\",\"reference\":\"INC-124\",\"summary\":\"Users experiencing 429 errors on /api/v2/users endpoint\",\"created_at\":\"2025-11-01T09:15:00Z\",\"updated_at\":\"2025-11-01T09:20:00Z\",\"incident_status\":{\"category\":\"live\",\"name\":\"Identified\"},\"severity\":{\"name\":\"P2\",\"rank\":2},\"incident_role_assignments\":[{\"role\":{\"name\":\"Incident Lead\"},\"assignee\":{\"name\":\"Alex Martinez\"}}],\"incident_type\":{\"name\":\"Service Outage\"},\"custom_field_entries\":[{\"custom_field\":{\"name\":\"Affected teams\"},\"values\":[{\"value_catalog_entry\":{\"name\":\"New Ventures\"}}]}]},{\"id\":\"01HZXYZ125GHI\",\"name\":\"Monitoring alerts not delivering\",\"reference\":\"INC-125\",\"summary\":\"PagerDuty integration failing to send notifications\",\"created_at\":\"2025-11-01T08:00:00Z\",\"updated_at\":\"2025-11-01T10:30:00Z\",\"incident_status\":{\"category\":\"learning\",\"name\":\"Post-incident\"},\"severity\":{\"name\":\"P3\",\"rank\":3},\"incident_role_assignments\":[{\"role\":{\"name\":\"Incident Lead\"},\"assignee\":{\"name\":\"Jordan Lee\"}}],\"incident_type\":{\"name\":\"Infrastructure\"},\"custom_field_entries\":[]}],\"pagination_meta\":{\"after\":null,\"page_size\":25}}"
polling_verb: get
polling_url: https://api.incident.io/v2/incidents?page_size={{ max_incidents }}&status_category[one_of]=live&status_category[one_of]=learning
polling_headers: Authorization=Bearer {{ api_key }}
polling_body: ''
id: 175032
custom_fields:
- keyname: api_key
  field_type: password
  name: Incident.io API Key
  description: Your Incident.io API key. Get it from Settings > API Keys in your Incident.io dashboard.
  placeholder: inc_xxxxxxxxxxxxx
- keyname: max_incidents
  field_type: number
  name: Max Incidents to Display
  description: Maximum number of incidents to show in the list
  placeholder: 100
- keyname: bio
  name: Incident.io Incidents
  field_type: author_bio
  description: Display real-time incident management data from Incident.io. Shows active incidents, critical counts, severity levels (P1-P5), duration, and impact information including affected teams, services, and users. Optimized for e-ink displays with high contrast black text.
  github_url: https://github.com/brittonjg/trmnl-incident-io
  learn_more_url: https://jbritton.uk
  email_address: me@jbritton.uk
name: Incident.io Incidents
refresh_interval: 15
